# ============================================================
#  guidance_rl 全局配置
#  所有数值与 ros2_ws 现有实现对齐：
#    相机参数  : uav_vision_png/config/params.yaml
#    PNG 参数  : 同上（launch 加载的调好的那组）
#    目标运动  : uav_target_sim/src/uav_target_sim.cpp
# ============================================================

camera:
  focal_length: 1397.2        # (1920/2)/tan(1.204/2)，IMX214 @ OAK-D Lite
  image_width: 1920
  image_height: 1080
  # ---- 检测噪声模型（Gym 专用，模拟 YOLO+LightTrack 输出）----
  pixel_noise_frac: 0.06      # bbox 中心抖动 σ = max(1px, frac*w)
  size_noise_frac: 0.10       # bbox 尺寸抖动 σ（相对值）
  miss_base: 0.02             # 基础漏检率
  miss_small_scale: 0.25      # 小目标附加漏检：p += scale*exp(-w/miss_small_px)
  miss_small_px: 6.0
  latency_frames_max: 2       # 每集随机延迟 0~N 帧（检测耗时+话题传输）
  min_bbox_px: 2.0
  target_size_w: 0.50         # x500 机架可视宽度 (m)
  target_size_h: 0.30         # 可视高度 (m)
  target_size_jitter: 0.2     # 每集 ±20% 随机

png:
  # ---- 与 uav_vision_png params.yaml 一致 ----
  kv: 4.0
  kz: 4.0
  speed_cmd: 5.0              # 期望冲击速度上限 (m/s)
  speed_min: 2.0              # handle_intercept 下限
  d_gain: 1.0
  k1_yaw: 0.0005              # 偏航 P 增益 (rad/s per px)
  k2_yaw: 0.0002              # 偏航 D 增益
  yaw_rate_max: 1.0           # 偏航角速率限幅 (rad/s)
  k_ey: 0.012                 # ey→vz 垂直补偿 (m/s per px)
  vz_ey_max: 3.0              # 垂直补偿限幅 (m/s)
  los_diff_thresh: 0.02       # LOS 变化量更新阈值 (rad)
  elev_clamp: 0.7853981633974483   # 仰角限幅 ±π/4
  # ---- 丢失分级（C++ 中按 60Hz 检测帧计数：coast=30/lost=90 ≈ 0.5s/1.5s）----
  # Gym 以 20Hz 步进，换算为步数
  coast_steps: 10             # < 0.5s 惯性续飞
  lost_steps: 30              # > 1.5s 判定丢失（终止集）
  search_yaw_rate: 0.2        # TRACK_LOST 慢旋搜索 (rad/s)

dynamics:
  dt: 0.05                    # 20Hz，与 png_calculate 频率一致
  tau_v: 0.40                 # 速度指令一阶响应时间常数 (s)，按 Gazebo 实测校准
  tau_yaw_rate: 0.15          # 偏航角速率响应 (s)
  tau_att: 0.20               # 前倾姿态响应 (s)
  a_max: 6.0                  # 最大水平/垂直加速度 (m/s^2)
  v_max: 8.0                  # 速度硬限幅 (m/s)
  tilt_max: 0.6               # roll/pitch 限幅 (rad)

target:
  # ---- 移植 uav_target_sim.cpp（dt=0.1 已换算到连续时间）----
  modes: [circle, sinusoidal, random_walk, hover_escape]
  mode_probs: [0.25, 0.25, 0.35, 0.15]
  alt: -5.0                   # NED z
  alt_jitter: 1.0
  max_range: 10.0             # 边界半径（apply_boundary）
  max_range_jitter: 2.0
  circle:
    radius: 5.0               # 每集在 [radius*(1±jitter)] 内随机
    radius_jitter: 0.4
    omega: 0.5                # rad/s（cpp 构造函数 0.05/0.1s）
    omega_jitter: 0.4
  sinusoidal:
    base_speed: 1.0           # 前向匀速 (m/s)
    base_speed_jitter: 0.5
    amplitude: 0.5            # 侧向加速度幅值 (m/s^2)
    amplitude_jitter: 0.5
    omega: 0.5                # rad/s
    omega_jitter: 0.4
  random_walk:
    sigma_v: 0.2              # 速度扰动 σ（每 0.1s 一步，Gym 内按 sqrt(dt/0.1) 缩放）
    sigma_v_jitter: 0.5
    max_speed: 3.0
  hover_escape:
    trigger_range: 6.0        # 拦截机接近至此距离时开始逃逸
    accel: 2.0                # 逃逸加速度 (m/s^2)
    max_speed: 3.0

env:
  episode_max_steps: 1200     # 60s @ 20Hz
  hit_radius: 0.8             # 与统计层一致
  spawn_range: [8.0, 25.0]    # 初始距离 (m)
  spawn_az_jitter: 0.25       # 初始方位相对机头偏差 (rad)
  standby_alt: -6.0           # 拦截机初始高度（NED）
  ground_z: -0.5              # 触地判定
  # ---- 奖励权重 ----
  reward:
    w_close: 1.0              # 接近速率（归一化到 speed_cmd）
    hit_bonus: 50.0
    w_fov: 0.1                # FOV 偏离二次惩罚
    invalid_penalty: 0.2      # 丢失帧惩罚（每步）
    w_smooth: 0.05            # 动作平滑 ||a_t-a_{t-1}||^2
    time_penalty: 0.01
    fov_lost_penalty: 20.0    # 终止：长时间丢失
    timeout_penalty: 10.0
    ground_penalty: 20.0

action:
  # 带 PNG 归纳偏置的动作解码（零动作 ≈ 纯追踪）
  # 1.2 rad：实测 0.8 会截断 PNG 对圆周目标的累积前置角（a1 饱和率 17%）
  dv_angle_max: 1.2           # a0/a1 → 相对 LOS 的速度方向偏移上限 (rad)
  # speed = speed_min + (speed_cmd-speed_min)*(a3+1)/2
  # yaw_rate = a4 * png.yaw_rate_max

model:
  obs_dim: 15
  priv_dim: 9                 # 特权观测：相对位置/相对速度/目标速度（仅 Critic）
  act_dim: 4
  gru_hidden: 128
  head_hidden: 64
  critic_hidden: 256
  init_log_std: -1.0

bc:
  episodes: 2000              # PNG 老师采样集数
  seq_len: 64                 # BPTT 序列长度
  batch_size: 256
  lr: 3.0e-4
  epochs: 20
  val_frac: 0.05

ppo:
  num_envs: 64
  rollout_steps: 128
  total_steps: 5000000
  epochs: 4
  num_minibatches: 4          # 按环境维度切分
  gamma: 0.995
  gae_lambda: 0.95
  clip_eps: 0.2
  ent_coef: 0.001
  vf_coef: 0.5
  lr: 1.0e-4                  # BC 热启动后微调用小学习率
  max_grad_norm: 0.5
  target_kl: 0.03             # 超过则提前结束本轮 epoch
  log_std_min: -2.5
  log_std_max: 0.0

# ---- 阶段二 图像参数 ----
v2:
  crop_size: 288
  aux_bbox_coef: 2.0         # BC 训练辅助 bbox 回归权重
  aux_conf_coef: 0.5          # BC 训练辅助置信度权重
  # 以下从 camera 节继承：focal_length, image_width, image_height, target_size_*
  pretrained_cnn: true        # MobileNetV3 ImageNet 预训练
  # 无人机纹理图片路径（PNG 透明背景俯视图最佳）
  # 设为空字符串 "" 则仅用几何图形（cross/diamond/quad）
  # 设为路径则按 sprite_prob 概率使用真实纹理
  sprite_path: "/home/verser/Pictures/data.jpg"
  sprite_prob: 0.9             # 90% 纹理 + 10% 几何混合（防过拟合单一形状）
